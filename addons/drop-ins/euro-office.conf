[Unit]
Wants=euro-office.container

[Container]

Environment=EURO_OFFICE_DOMAIN=euro-office.opencloud.test

Environment=OC_ADD_RUN_SERVICES=collaboration
Environment=COLLABORATION_WOPI_SRC=https://cloud.opencloud.test
Environment=COLLABORATION_APP_NAME=Euro-Office
Environment=COLLABORATION_APP_PRODUCT=OnlyOffice
Environment=COLLABORATION_APP_ADDR=https://euro-office.opencloud.test
Environment=COLLABORATION_APP_ICON=https://euro-office.opencloud.test/web-apps/apps/documenteditor/main/resources/img/favicon.ico
Environment=COLLABORATION_APP_INSECURE=false
Environment=COLLABORATION_CS3API_DATAGATEWAY_INSECURE=false
Environment=COLLABORATION_APP_PROOF_DISABLE=true

Volume=./config/euro-office/app-registry.yaml:/etc/opencloud/app-registry.yaml:z
